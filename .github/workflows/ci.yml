name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install frontend dependencies
        run: pnpm --dir web/admin-vben install --frozen-lockfile

      - name: Check frontend API contract registry
        run: make admin.contract

      - name: Run backend tests
        run: go test ./...

      - name: Check route and OpenAPI contracts
        run: go test ./app/api/internal/docs ./app/console/internal/docs -run 'Contract' -v

      - name: Run backend race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check Go formatting
        shell: bash
        run: |
          files=$(find . -name '*.go' -not -path './web/*' -not -path './vendor/*' -print)
          if [ -n "$files" ] && [ -n "$(gofmt -l $files)" ]; then
            gofmt -l $files
            exit 1
          fi

      - name: Run Go lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Check patch whitespace
        run: git diff --check

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan Go dependencies and call graph
        run: govulncheck ./...

      - name: Run PostgreSQL integration tests
        env:
          GROVE_INTEGRATION_DB: postgres
        run: go test -tags=integration ./tests/integration -v

      - name: Run MySQL integration tests
        env:
          GROVE_INTEGRATION_DB: mysql
        run: go test -tags=integration ./tests/integration -v

      - name: Build backend binaries
        run: make build

      - name: Typecheck console frontend
        run: make admin.typecheck

      - name: Run console unit tests
        run: pnpm --dir web/admin-vben test:unit

      - name: Build console frontend
        run: pnpm --dir web/admin-vben build:console

      - name: Lint console frontend
        run: pnpm --dir web/admin-vben lint

      - name: Check console circular dependencies
        run: pnpm --dir web/admin-vben check:circular
