name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install frontend dependencies
        run: pnpm --dir web/admin-vben install --frozen-lockfile

      - name: Run backend tests
        run: go test ./...

      - name: Check route and OpenAPI contracts
        run: go test ./app/api/internal/docs ./app/console/internal/docs -run 'RouteContract' -v

      - name: Run backend race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan Go dependencies and call graph
        run: govulncheck ./...

      - name: Run PostgreSQL integration tests
        run: go test -tags=integration ./tests/integration -v

      - name: Build backend binaries
        run: make build

      - name: Typecheck console frontend
        run: make admin.typecheck

      - name: Run console unit tests
        run: pnpm --dir web/admin-vben test:unit

      - name: Build console frontend
        run: pnpm --dir web/admin-vben build:console
