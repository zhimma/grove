name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.x'

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm --dir web/admin-vben install --no-frozen-lockfile

      - name: Run backend tests
        run: go test ./...

      - name: Build backend binaries
        run: make build

      - name: Typecheck console frontend
        run: make admin.typecheck
