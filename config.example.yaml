app:
  name: grove
  env: development
  # 本地默认值直接写在此文件中；生产环境请复制后按环境修改。
  debug: true

port: 8080
console_port: 8081
worker_port: 8082

server:
  shutdown_timeout: 30
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 60
  max_header_bytes: 1048576
  max_body_bytes: 33554432

log:
  level: info
  path: ./logs
  console: true
  service: grove

databases:
  default:
    enabled: true
    driver: mysql
    host: 127.0.0.1
    port: 3306
    user: root
    password: ''
    dbname: db_grove
    ssl_mode: disable
    charset: utf8mb4
    parse_time: true
    loc: Local
    tls: false
    max_connections: 20
    max_idle_conns: 10
    conn_max_lifetime: 3600
    connect_timeout: 5
  resources: {}

redis:
  enabled: true
  addr: 127.0.0.1:6379
  password: ''
  db: 0

jwt:
  secret: ''
  issuer: grove
  access_expiry_hours: 24
  refresh_expiry_hours: 168

job:
  enabled: true
  concurrency: 10
  queues:
    default: 5
    critical: 3
    low: 1

scheduler:
  # Scheduler 只由 worker 进程承载；除非业务自行做跨实例协调，否则只启用一个实例。
  enabled: false
  timezone: Local

observability:
  enabled: true
  metrics_enabled: true
  metrics_path: /metrics
  readiness_timeout: 3
  trace_sample_ratio: 0.1
  otlp_trace_endpoint: ''
  otlp_insecure: false

casbin:
  enforcers:
    api:
      enabled: false
      database: default
      mode: rbac
      table_name: casbin_rules
    console:
      enabled: true
      database: default
      mode: rbac
      table_name: console_casbin_rules

storage:
  default: local
  default_upload_policy: document
  upload_policies:
    avatar:
      directory: avatars
      max_bytes: 5242880
      extensions: [.jpg, .jpeg, .png, .gif, .webp]
      mime_types: [image/jpeg, image/png, image/gif, image/webp]
    article-cover:
      directory: article-covers
      max_bytes: 5242880
      extensions: [.jpg, .jpeg, .png, .gif, .webp]
      mime_types: [image/jpeg, image/png, image/gif, image/webp]
    document:
      directory: documents
      max_bytes: 20971520
      extensions: [.pdf, .txt, .csv, .doc, .docx, .xls, .xlsx]
      mime_types:
        [
          application/pdf,
          text/plain,
          text/csv,
          application/x-ole-storage,
          application/zip,
          application/octet-stream,
        ]
  disks:
    local:
      driver: local
      root: ./storage
      base_url: /storage
      # 文件默认私有；local 盘只有明确同时开启 public 和 serve_static 才会返回应用直链并公开静态访问。
      public: false
      serve_static: false
      prefix: console
    s3:
      driver: s3
      endpoint: s3.ap-southeast-1.amazonaws.com
      region: ap-southeast-1
      bucket: demo-bucket
      access_key: ''
      secret_key: ''
      secure: true
      base_url: ''
      public: false
      serve_static: false
      prefix: console
      sts:
        enabled: false
        endpoint: ''
        region: ap-southeast-1
        role_arn: ''
        role_session_name: grove-console
        duration: 3600
        allow_prefix:
          - 'console/${user_id}'
        allow_actions:
          - s3:PutObject
          - s3:GetObject
          - s3:AbortMultipartUpload
          - s3:ListBucketMultipartUploads
          - s3:ListMultipartUploadParts

docs:
  enabled: true
  title: Grove API
  description: API framework scaffold for interface-driven services
  version: 1.0.0
  base_path: /api/v1
  scalar_script_url: https://cdn.jsdelivr.net/npm/@scalar/api-reference
  schemes:
    - http

cors:
  enabled: true
  allowed_origins:
    - '*'
  allowed_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed_headers:
    - Authorization
    - Content-Type
    - X-Request-Id
  allow_credentials: false
  max_age: 600

api:
  prefix: /api/v1
  default_per_page: 20
  max_per_page: 100

demo:
  # Demo endpoints are intended for local development and tests. Production always ignores this switch.
  enabled: false

security:
  # 仅用于首次 bootstrap 创建 root；数据库中仍保存 bcrypt 哈希。
  # 请复制配置后填写一个仅供本地或当前环境使用的密码。
  initial_root_password: ''
  # Empty means no reverse proxy is trusted. Add only explicit proxy IPs or CIDRs.
  trusted_proxies: []
  hsts_enabled: false
  # Independent application key for encrypting business config secrets.
  # Use at least 32 random bytes or base64:<32-byte-base64>. Never store this key in system_configs.
  config_encryption_key: ''
  login:
    enabled: true
    attempts_per_minute: 10
    burst: 5
    failure_limit: 5
    lock_seconds: 900
