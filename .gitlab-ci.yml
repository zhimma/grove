# GitLab 是 Grove 的 canonical CI；.github/workflows/ci.yml 保留为镜像，
# 以便镜像仓库和外部 PR 获得同等基础门禁。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - quality
  - integration
  - build

default:
  interruptible: true

variables:
  GOTOOLCHAIN: local
  GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

.go_job:
  image: golang:1.27.1-bookworm
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go-mod
      - .cache/go-build
  before_script:
    - go version
    - go mod download

go_quality:
  extends: .go_job
  stage: quality
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - DIFF_BASE="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}" make quality.go.fmt quality.go.vet diff.check quality.govuln test contracts test.race build

go_lint:
  extends: .go_job
  stage: quality
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    - golangci-lint version
    - make quality.go.lint

frontend_quality:
  stage: quality
  image: node:20.19.5-bookworm
  cache:
    key:
      files:
        - web/admin-vben/pnpm-lock.yaml
    paths:
      - web/admin-vben/.pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.28.2 --activate
    - pnpm --dir web/admin-vben config set store-dir .pnpm-store
    - make admin.install
  script:
    - make admin.contract admin.lint admin.circular admin.typecheck admin.test admin.build

# 这两个 Job 通过 Testcontainers 启动真实数据库。GitLab Runner 必须使用已启用
# privileged Docker executor 的 runner；未满足该前提应修复 runner，而不是跳过测试。
.testcontainers_job:
  extends: .go_job
  stage: integration
  services:
    - name: docker:27.3.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "false"

integration_postgres:
  extends: .testcontainers_job
  script:
    - GROVE_INTEGRATION_DB=postgres go test -tags=integration ./tests/integration -v

integration_mysql:
  extends: .testcontainers_job
  script:
    - GROVE_INTEGRATION_DB=mysql go test -tags=integration ./tests/integration -v

integration_redis:
  extends: .go_job
  stage: integration
  services:
    - name: redis:7.4.2-alpine
      alias: redis
  variables:
    CACHE_REDIS_ADDR: redis:6379
    CACHE_REDIS_DB: "15"
    CACHE_REDIS_PASSWORD: ""
  script:
    - go test -tags=integration ./pkg/cache -run '^TestRedisStoreContract$' -v

# 仅验证三个服务镜像可以构建；镜像漏洞扫描的执行命令和接入条件见 docker/README.md。
# 此 Job 同样需要 privileged Docker executor。
container_build:
  stage: build
  image: docker:27.3.1-cli
  services:
    - name: docker:27.3.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker version
    - docker build --build-arg SERVICE=api --tag grove-api:$CI_COMMIT_SHA .
    - docker build --build-arg SERVICE=console --tag grove-console:$CI_COMMIT_SHA .
    - docker build --build-arg SERVICE=worker --tag grove-worker:$CI_COMMIT_SHA .
